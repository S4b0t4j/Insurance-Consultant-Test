# Cloudflare Pages Configuration
# For Education News Monitor - Marsh Education Practice

name = "education-news-monitor"
compatibility_date = "2024-01-01"

# Pages configuration
pages_build_output_dir = "build/web"

# Build settings (used when running wrangler pages dev)
[build]
command = "flutter build web --release"

# Environment variables (if needed)
[vars]
APP_NAME = "Education News Monitor"
