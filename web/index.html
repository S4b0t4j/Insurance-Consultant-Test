<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Real-time education news intelligence dashboard for Marsh Education Practice. Monitor education news, NIL/Sports updates, and risk analysis.">
  <meta name="keywords" content="education news, NIL, sports, higher education, Marsh, insurance, risk analysis">
  <meta name="author" content="Marsh Education Practice">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme Color -->
  <meta name="theme-color" content="#002D72">
  <meta name="msapplication-navbutton-color" content="#002D72">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Education News">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Education News Monitor - Marsh Education Practice</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #002D72;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #002D72 0%, #0066CC 100%);
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .loading-logo svg {
      width: 48px;
      height: 48px;
      fill: white;
    }

    .loading-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .loading-subtext {
      color: rgba(255, 255, 255, 0.8);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 32px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="loading-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
      </svg>
    </div>
    <div class="loading-text">Education News Monitor</div>
    <div class="loading-subtext">Marsh Education Practice</div>
    <div class="loading-spinner"></div>
  </div>
  <!-- Local pdf.js bundle: PDF text extraction for Report Studio sources -->
  <script src="pdfjs/pdf.min.js"></script>
  <script src="pdfjs/pdf_extract.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
