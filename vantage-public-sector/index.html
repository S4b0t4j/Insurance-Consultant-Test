<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTAGE | Public Entity and Education</title>
<!-- Dev entry point. Serve with npm run dev; the shipping artifact is
     dist/VANTAGE_PublicSector.html produced by npm run build. -->
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/vantage.css">
<!-- three.js r128, pinned. The bundle inlines vendor/three.r128.min.js when
     built with the vendor flag; the app degrades to the SVG elevation
     fallback if THREE is absent or WebGL is unavailable. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="demo-banner">DEMONSTRATION BUILD &middot; values marked MODELED are synthetic placeholders, not research &middot; this banner stays until every modeled field is replaced</div>
<noscript><div class="noscript-msg">VANTAGE needs JavaScript to run. This viewer has scripts disabled; download the file and open it in a browser instead.</div></noscript>

<div id="auth-screen"></div>

<div id="app-shell" hidden>
  <header class="topbar">
    <div>
      <h1 class="brand-word">VANTA<span class="brand-tail">GE</span></h1>
      <div class="brand-practice">Public Entity and Education</div>
    </div>
    <nav class="nav-tabs" id="nav-tabs"></nav>
    <div class="user-chip" id="user-chip"></div>
  </header>
  <div class="kpi-strip" id="kpi-strip"></div>
  <main id="view-root"></main>
</div>

<div id="drawer-overlay" hidden></div>
<aside id="drawer" hidden></aside>

<script src="src/state.js"></script>
<script src="src/auth.js"></script>
<script src="src/scope.js"></script>
<script src="src/map-cartogram.js"></script>
<script src="src/map-geo.js"></script>
<script src="src/viewer-3d.js"></script>
<script src="src/drawer.js"></script>
<script src="src/lenore.js"></script>
<script src="src/views/map.js"></script>
<script src="src/views/segments.js"></script>
<script src="src/views/pipeline.js"></script>
<script src="src/views/verification.js"></script>
<script>document.addEventListener('DOMContentLoaded', function () { V.boot(); });</script>
</body>
</html>
